<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 32">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="50%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#e94560"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#e0e0ff"/>
      <stop offset="100%" style="stop-color:#ffffff"/>
    </linearGradient>
    <filter id="hardShadow">
      <feDropShadow dx="0.6" dy="0.6" stdDeviation="0" flood-color="#0a0a1a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Left bracket using rects (exact positioning) -->
  <rect x="4" y="2" width="1.2" height="20" fill="#e94560" opacity="0.5"/>
  <rect x="4" y="2" width="5" height="1.2" fill="#e94560" opacity="0.5"/>
  <rect x="4" y="20.8" width="5" height="1.2" fill="#e94560" opacity="0.5"/>

  <!-- Right bracket using rects (exact positioning) -->
  <rect x="194.8" y="2" width="1.2" height="20" fill="#e94560" opacity="0.5"/>
  <rect x="191" y="2" width="5" height="1.2" fill="#e94560" opacity="0.5"/>
  <rect x="191" y="20.8" width="5" height="1.2" fill="#e94560" opacity="0.5"/>

  <!-- Center point = 100. OSINT + CTF centered on it -->

  <!-- OSINT shadow -->
  <text x="80" y="17" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="17" fill="#0f3460" font-weight="900" letter-spacing="2" text-anchor="middle" filter="url(#hardShadow)">OSINT</text>
  <!-- OSINT main -->
  <text x="79.5" y="16.5" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="17" fill="url(#textGrad)" font-weight="900" letter-spacing="2" text-anchor="middle">OSINT</text>

  <!-- Glitch lines -->
  <rect x="40" y="9" width="80" height="0.7" fill="#e94560" opacity="0.12"/>
  <rect x="50" y="13" width="50" height="0.5" fill="#4cc9f0" opacity="0.08"/>

  <!-- CTF badge centered at x=140 -->
  <rect x="118" y="4" rx="3.5" ry="3.5" width="30" height="14" fill="url(#glow)"/>
  <rect x="118.4" y="4.4" rx="3" ry="3" width="29.2" height="13.2" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.3"/>
  <text x="133" y="14" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="9" fill="white" font-weight="900" text-anchor="middle" letter-spacing="1.2">CTF</text>

  <!-- Subtitle centered -->
  <text x="100" y="28.5" font-family="'Courier New', monospace" font-size="3.5" fill="#8892b0" letter-spacing="2" font-weight="400" text-anchor="middle">HAPPY HACKING SPACE</text>

  <!-- Decorative dots -->
  <circle cx="168" cy="28.5" r="0.9" fill="#e94560" opacity="0.6"/>
  <circle cx="172" cy="28.5" r="0.9" fill="#4cc9f0" opacity="0.6"/>
  <circle cx="176" cy="28.5" r="0.9" fill="#33d6a6" opacity="0.6"/>
</svg>
